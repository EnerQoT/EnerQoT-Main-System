version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enerqot-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/enerqot
    volumes:
      - ./backend:/app
    depends_on:
      - db
    networks:
      - enerqot-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enerqot-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - enerqot-network

  db:
    image: postgres:15-alpine
    container_name: enerqot-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=enerqot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - enerqot-network

volumes:
  postgres_data:

networks:
  enerqot-network:
    driver: bridge

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enerqot-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/enerqot
      - MONGODB_DATABASE=enerqot
    depends_on:
      - mongo
    networks:
      - enerqot-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enerqot-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    networks:
      - enerqot-network

  mongo:
    image: mongo:6.0
    container_name: enerqot-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - enerqot-network

volumes:
  mongo_data:

networks:
  enerqot-network:
    driver: bridge

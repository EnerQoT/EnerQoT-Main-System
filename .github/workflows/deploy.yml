name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Optional: add port if you use a non-standard SSH port
          # port: ${{ secrets.VPS_PORT }}
          script: |
            # Create project directory if it doesn't exist
            mkdir -p ~/EnerQoT-Main-System
            cd ~/EnerQoT-Main-System
            
            # Check if it's a git repo, if not clone it
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            fi
            
            # Pull latest changes from the main branch
            git fetch origin main
            git reset --hard origin/main
            
            # Create necessary config directories
            mkdir -p backend/config
            
            # Create a .env file from GitHub Secrets
            cat << 'EOF' > backend/.env
            ${{ secrets.BACKEND_ENV }}
            EOF
            
            # Create Firebase credentials file from GitHub Secrets
            cat << 'EOF' > backend/config/firebase_credentials.json
            ${{ secrets.FIREBASE_JSON }}
            EOF
            
            # Rebuild and restart the Docker containers
            docker-compose down
            docker-compose up -d --build
